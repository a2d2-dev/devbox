# OTA Agent 配置文件示例
# 复制此文件为 config.yaml 并根据实际环境修改

node:
  # 节点ID（唯一标识符）
  # 留空则使用主机名
  id: "node-001"

mqtt:
  # NATS MQTT 服务器地址
  host: "198.19.249.2"  # 替换为实际的 LoadBalancer External IP

  # MQTT over TLS 端口
  port: 8883

  # CA 证书文件路径
  ca_file: "certs/ca.crt"

  # MQTT Client ID（留空则自动生成）
  client_id: ""

console:
  # Supervisor Unix socket 路径
  supervisor_socket: "/var/run/supervisor.sock"
  # Supervisor conf.d 目录（用于解析端口）
  supervisor_conf_dir: "/etc/supervisor/conf.d"

logging:
  # 日志级别: debug, info, warn, error
  level: "debug"

  # 日志文件路径（留空则输出到 stdout）
  file: ""
