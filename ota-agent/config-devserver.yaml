# Dev Server 配置
# 替换 supervisor-dashboard.py，监听 3801 端口

device:
  name: devserver

mqtt:
  host: "127.0.0.1"
  port: 1883
  ca_file: ""

console:
  enabled: true
  port: 3801
  static_dir: ""
  supervisor_socket: "/var/run/supervisor.sock"
  supervisor_conf_dir: "/etc/supervisor/conf.d"

logging:
  level: info
  file: ""
