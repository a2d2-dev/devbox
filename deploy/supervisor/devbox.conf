; Devbox supervisor 单元。约定与该机同域其它服务保持一致：
;   - 二进制走项目源码目录 bin/
;   - 运行时 config 在 /etc/devbox/
;   - 日志聚合到 /data/log/supervisord/
;
; 部署步骤见 docs/deploy-supervisor.md。

[program:devbox]
command=/data/src/github.com/a2d2-dev/devbox/bin/devbox --config /etc/devbox/config.yaml
directory=/data/src/github.com/a2d2-dev/devbox
environment=HOME="/root",PATH="/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/data/log/supervisord/devbox-stdout.log
stderr_logfile=/data/log/supervisord/devbox-stderr.log
